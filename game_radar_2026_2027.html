<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Radar | بازی‌های آینده</title>
<style>
:root{--bg:#080b14;--panel:#111827;--muted:#a9b3c9;--text:#f5f7ff;--accent:#7c5cff;--accent2:#20d6c7}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,#20204c 0,transparent 45%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;padding:20px 5vw;border-bottom:1px solid #ffffff12;position:sticky;top:0;background:#080b14dc;backdrop-filter:blur(12px);z-index:5}
.brand{font-weight:900;letter-spacing:.5px;font-size:1.15rem}.brand span{color:var(--accent2)}.controls{display:flex;gap:9px}.btn{border:1px solid #ffffff20;background:#ffffff0c;padding:9px 13px;border-radius:12px}.btn:hover{background:#ffffff18}.hero{padding:56px 5vw 30px;max-width:1200px;margin:auto}.eyebrow{color:var(--accent2);font-weight:700;font-size:.8rem;letter-spacing:2px}.hero h1{font-size:clamp(2rem,5vw,4rem);line-height:1.1;margin:12px 0}.hero p{color:var(--muted);max-width:650px;line-height:1.8}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0}.filter{border:1px solid #ffffff22;background:#ffffff08;padding:8px 13px;border-radius:999px}.filter.active{background:var(--accent);border-color:var(--accent)}
.grid{max-width:1200px;margin:auto;padding:10px 5vw 70px;display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:18px}
.game{border:1px solid #ffffff18;border-radius:18px;overflow:hidden;background:#121827;min-height:245px;position:relative;cursor:pointer;transition:transform .18s,border .18s}.game:hover{transform:translateY(-4px);border-color:#7c5cff99}
.art{height:145px;background-size:cover;background-position:center;position:relative}.art:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#121827,transparent 75%)}.art .artlabel{position:absolute;bottom:14px;left:15px;right:15px;font-size:1.1rem;font-weight:900;z-index:1;text-shadow:0 2px 12px #000}
.info{padding:0 15px 15px}.date{font-size:.84rem;color:var(--accent2)}.genre{font-size:.78rem;color:var(--muted);margin-top:5px}.count{font-size:.88rem;margin-top:9px;color:#e7eaff}
.detail{position:fixed;inset:0;z-index:10;display:none;overflow:auto;background:#080b14}.detail.open{display:block}.detailHero{min-height:62vh;background-size:cover;background-position:center;position:relative;padding:24px 5vw;display:flex;flex-direction:column;justify-content:flex-end}.detailHero:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#080b14 2%,#080b14a8 50%,#080b1460)}.detailTop,.detailContent{position:relative;z-index:1;max-width:1150px;width:100%;margin:auto}.detailTop{display:flex;justify-content:space-between;align-items:center;position:absolute;top:24px;left:0;right:0}.detailTitle{font-size:clamp(2.1rem,6vw,5rem);font-weight:900;margin:0 0 12px;line-height:1.1}.detailContent{padding-bottom:32px}.countbox{background:#ffffff0b;border:1px solid #ffffff20;border-radius:18px;padding:16px 18px;display:inline-block;margin:14px 0}.timer{font-size:clamp(1.2rem,3vw,2rem);font-weight:800;letter-spacing:1px;color:var(--accent2)}.detailInfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:20px 0}.tile{background:#121827;border:1px solid #ffffff14;border-radius:14px;padding:14px}.tile small{display:block;color:var(--muted);margin-bottom:6px}.note{color:var(--muted);font-size:.9rem;line-height:1.7}.back{background:#111827e8;border:1px solid #ffffff30;border-radius:12px;padding:10px 14px}.empty{color:var(--muted);padding:40px;text-align:center;display:none}
footer{color:#77819b;text-align:center;padding:0 5vw 35px;font-size:.8rem}
@media(max-width:560px){.top{padding:14px 4vw}.hero{padding:36px 4vw 20px}.grid{padding:8px 4vw 50px}.detailHero{min-height:70vh}.detailTop{top:16px}}
</style>
</head>
<body>
<header class="top"><div class="brand">GAME <span>RADAR</span></div><div class="controls"><button class="btn" id="langBtn">English</button></div></header>
<section class="hero">
<div class="eyebrow" id="eyebrow">تقویم انتشار بازی‌ها</div>
<h1 id="headline">بازی‌های آینده را دنبال کن</h1>
<p id="subhead">روی هر بازی بزن تا صفحه اختصاصی، تاریخ انتشار و شمارش معکوس لحظه‌ای را ببینی.</p>
<div class="filters" id="filters"></div>
</section>
<div class="grid" id="games"></div><div class="empty" id="empty"></div>
<footer id="footnote">تاریخ‌ها ممکن است تغییر کنند. شمارش معکوس بر اساس ساعت دستگاه شماست.</footer>
<section class="detail" id="detail">
<div class="detailHero" id="detailBg">
<div class="detailTop"><button class="back" id="backBtn">← بازگشت</button><button class="btn" id="detailLangBtn">English</button></div>
<div class="detailContent"><div class="eyebrow" id="dEyebrow">صفحه اختصاصی بازی</div><h1 class="detailTitle" id="dTitle"></h1><div class="countbox"><div id="countLabel">شمارش معکوس تا انتشار</div><div class="timer" id="timer"></div></div></div>
</div>
<div class="detailContent" style="padding:25px 5vw 60px">
<div class="detailInfo"><div class="tile"><small id="dateLabel">تاریخ انتشار</small><strong id="dDate"></strong></div><div class="tile"><small id="platformLabel">پلتفرم</small><strong id="dPlatform"></strong></div><div class="tile"><small id="genreLabel">ژانر</small><strong id="dGenre"></strong></div><div class="tile"><small id="statusLabel">وضعیت</small><strong id="dStatus"></strong></div></div>
<p class="note" id="dNote"></p></div></section>
<script>
const games=[
{id:"gta",title:"Grand Theft Auto VI",date:"2026-11-19T00:00:00",genre:{fa:"جهان‌باز / اکشن",en:"Open-world / Action"},platform:"PS5 · Xbox Series",image:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1600&q=85",note:{fa:"بازگشت به دنیای جنایی و جهان‌باز GTA. تاریخ انتشار در این نسخه از تقویم، ۱۹ نوامبر ۲۰۲۶ درج شده است.",en:"A new open-world GTA adventure. Release date shown in this tracker: November 19, 2026."}},
{id:"dawn",title:"Warhammer 40,000: Dawn of War IV",date:"2026-12-03T00:00:00",genre:{fa:"استراتژی",en:"Strategy"},platform:"PC",image:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1600&q=85",note:{fa:"نبردهای استراتژیک در دنیای Warhammer 40,000.",en:"A strategy entry set in the Warhammer 40,000 universe."}},
{id:"layton",title:"Professor Layton and the New World of Steam",date:"2026-12-10T00:00:00",genre:{fa:"معمایی / ماجراجویی",en:"Puzzle / Adventure"},platform:"Nintendo Switch",image:"https://images.unsplash.com/photo-1518709594023-6eab9bab7b23?auto=format&fit=crop&w=1600&q=85",note:{fa:"معماها و ماجراجویی تازه در دنیای پروفسور لیتون.",en:"A new mystery adventure in the Professor Layton universe."}},
{id:"poe2",title:"Path of Exile 2 (Full Release)",date:"2026-12-11T00:00:00",genre:{fa:"اکشن RPG",en:"Action RPG"},platform:"PC · Console",image:"https://images.unsplash.com/photo-1514533212735-5df27d970db0?auto=format&fit=crop&w=1600&q=85",note:{fa:"انتشار نسخه کامل، طبق فهرست انتشار.",en:"Full release, according to the release calendar."}},
{id:"stranger",title:"Stranger Than Heaven",date:"2027-01-15T00:00:00",genre:{fa:"اکشن / ماجراجویی",en:"Action / Adventure"},platform:"TBA",image:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1600&q=85",note:{fa:"بازی تازه‌ای با حال‌وهوای اکشن و داستانی.",en:"An upcoming action-oriented story game."}},
{id:"forza",title:"Forza Horizon 6 (PS5)",date:"2027-01-26T00:00:00",genre:{fa:"مسابقه‌ای / جهان‌باز",en:"Racing / Open-world"},platform:"PS5",image:"https://images.unsplash.com/photo-1503736334956-4c8f8e92946d?auto=format&fit=crop&w=1600&q=85",note:{fa:"نسخه پلی‌استیشن ۵ در تقویم انتشار با این تاریخ ثبت شده است.",en:"The PS5 release is listed for this date in the release calendar."}},
{id:"witchbrook",title:"Witchbrook",date:"2027-01-28T00:00:00",genre:{fa:"شبیه‌سازی / زندگی",en:"Life Sim"},platform:"PC · Switch · Xbox · PS5",image:"https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&w=1600&q=85",note:{fa:"شبیه‌سازی زندگی در فضای جادویی و مدرسه‌ای.",en:"A cozy life simulation in a magical school setting."}},
{id:"until",title:"Until Dawn 2",date:"2027-01-28T00:00:00",genre:{fa:"ماجراجویی داستانی",en:"Narrative Adventure"},platform:"PS5",image:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=85",note:{fa:"عنوان داستانی و ماجراجویی در فهرست ۲۰۲۷.",en:"A narrative adventure listed for 2027."}},
{id:"metro",title:"Metro 2039",date:"2027-02-04T00:00:00",genre:{fa:"ماجراجویی",en:"Adventure"},platform:"PC · PS5 · Xbox",image:"https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=85",note:{fa:"عنوان جدید مجموعه Metro با تاریخ ثبت‌شده فوریه ۲۰۲۷.",en:"A new Metro entry listed for February 2027."}},
{id:"tomb",title:"Tomb Raider: Legacy of Atlantis",date:"2027-02-12T00:00:00",genre:{fa:"اکشن / ماجراجویی",en:"Action / Adventure"},platform:"PC · PS5 · Xbox · Switch 2",image:"https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1600&q=85",note:{fa:"ماجراجویی تازه از مجموعه Tomb Raider.",en:"A new Tomb Raider adventure."}},
{id:"persona",title:"Persona 4 Revival",date:"2027-02-18T00:00:00",genre:{fa:"RPG",en:"RPG"},platform:"PC · PS5 · Xbox",image:"https://images.unsplash.com/photo-1518709594023-6eab9bab7b23?auto=format&fit=crop&w=1600&q=85",note:{fa:"بازسازی/نسخه جدید Persona 4 طبق فهرست انتشار.",en:"A revival of Persona 4 listed in the release calendar."}},
{id:"fable",title:"Fable",date:"2027-02-23T00:00:00",genre:{fa:"RPG / فانتزی",en:"Fantasy RPG"},platform:"PC · PS5 · Xbox",image:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1600&q=85",note:{fa:"ماجراجویی در دنیای فانتزی Albion؛ تاریخ انتشار در فهرست‌ها درج شده.",en:"A fantasy adventure in Albion; listed release date shown here."}},
{id:"wolong",title:"Wo Long 2: Wings of Ember",date:"2027-03-04T00:00:00",genre:{fa:"اکشن RPG",en:"Action RPG"},platform:"PC · PS5 · Xbox · Switch 2",image:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1600&q=85",note:{fa:"ادامه دنیای اکشن فانتزی Wo Long.",en:"A follow-up in the Wo Long action-fantasy universe."}},
{id:"007",title:"007 First Light (Switch 2)",date:"2027-03-18T00:00:00",genre:{fa:"اکشن / جاسوسی",en:"Action / Spy"},platform:"Switch 2",image:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1600&q=85",note:{fa:"نسخه Switch 2 در تقویم با این تاریخ ثبت شده.",en:"The Switch 2 version is listed for this date."}},
{id:"exodus",title:"Exodus",date:"2027-04-07T00:00:00",genre:{fa:"RPG / علمی‌تخیلی",en:"Sci-fi RPG"},platform:"PC · PS5 · Xbox",image:"https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=1600&q=85",note:{fa:"ماجراجویی نقش‌آفرینی در فضای علمی‌تخیلی.",en:"A science-fiction role-playing adventure."}},
{id:"ff7",title:"Final Fantasy VII: Revelation",date:"2027-04-08T00:00:00",genre:{fa:"RPG",en:"RPG"},platform:"PC · PS5 · Xbox · Switch 2",image:"https://images.unsplash.com/photo-1518709594023-6eab9bab7b23?auto=format&fit=crop&w=1600&q=85",note:{fa:"عنوان جدید Final Fantasy در فهرست انتشار ۲۰۲۷.",en:"A Final Fantasy entry listed in the 2027 calendar."}},
{id:"god",title:"God of War: Laufey",date:"2027-05-20T00:00:00",genre:{fa:"ماجراجویی",en:"Adventure"},platform:"PS5",image:"https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1600&q=85",note:{fa:"عنوان ثبت‌شده برای ماه مه ۲۰۲۷.",en:"Listed for May 2027."}},
{id:"kena",title:"Kena: Scars of Kosmora",date:"2027-10-23T00:00:00",genre:{fa:"ماجراجویی",en:"Adventure"},platform:"TBA",image:"https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=85",note:{fa:"در تقویم انتشار به‌صورت ۲۰۲۷ ثبت شده؛ روز دقیق نیازمند تأیید است.",en:"Listed for 2027; exact date should be confirmed."}}
];
const copy={fa:{eyebrow:"تقویم انتشار بازی‌ها",headline:"بازی‌های آینده را دنبال کن",subhead:"روی هر بازی بزن تا صفحه اختصاصی، تاریخ انتشار و شمارش معکوس لحظه‌ای را ببینی.",all:"همه",upcoming:"در انتظار انتشار",released:"منتشر شده",footnote:"تاریخ‌ها ممکن است تغییر کنند. شمارش معکوس بر اساس ساعت دستگاه شماست.",back:"← بازگشت",dEyebrow:"صفحه اختصاصی بازی",countLabel:"شمارش معکوس تا انتشار",dateLabel:"تاریخ انتشار",platformLabel:"پلتفرم",genreLabel:"ژانر",statusLabel:"وضعیت",releasedNow:"منتشر شده",unknown:"تاریخ دقیق اعلام نشده",day:"روز",hour:"ساعت",minute:"دقیقه",second:"ثانیه",empty:"بازی‌ای در این دسته پیدا نشد."},en:{eyebrow:"GAME RELEASE CALENDAR",headline:"Track upcoming games",subhead:"Select a game to open its page, release date, and live countdown.",all:"All",upcoming:"Upcoming",released:"Released",footnote:"Dates can change. Countdown uses your device clock.",back:"← Back",dEyebrow:"GAME DETAILS",countLabel:"Countdown to release",dateLabel:"Release date",platformLabel:"Platform",genreLabel:"Genre",statusLabel:"Status",releasedNow:"Released",unknown:"Exact date not announced",day:"days",hour:"hours",minute:"minutes",second:"seconds",empty:"No games found in this category."}};
let lang="fa",filter="all",selected=null,timerInterval;
const $=id=>document.getElementById(id);
function fmtDate(d){return new Intl.DateTimeFormat(lang==="fa"?"fa-IR":"en-US",{year:"numeric",month:"long",day:"numeric"}).format(d)}
function remaining(date){let ms=date-Date.now();if(ms<=0)return null;let d=Math.floor(ms/86400000),h=Math.floor(ms%86400000/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);return `${d} ${copy[lang].day} · ${h} ${copy[lang].hour} · ${m} ${copy[lang].minute} · ${s} ${copy[lang].second}`}
function status(g){return new Date(g.date).getTime()<=Date.now()?"released":"upcoming"}
function render(){
document.documentElement.lang=lang;document.documentElement.dir=lang==="fa"?"rtl":"ltr";let c=copy[lang];
$("eyebrow").textContent=c.eyebrow;$("headline").textContent=c.headline;$("subhead").textContent=c.subhead;$("footnote").textContent=c.footnote;$("langBtn").textContent=lang==="fa"?"English":"فارسی";
$("filters").innerHTML=["all","upcoming","released"].map(k=>`<button class="filter ${filter===k?"active":""}" data-filter="${k}">${c[k]}</button>`).join("");
$("filters").querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
let list=games.filter(g=>filter==="all"||status(g)===filter);$("games").innerHTML=list.map(g=>`<article class="game" data-id="${g.id}"><div class="art" style="background-image:url('${g.image}')"><div class="artlabel">${g.title}</div></div><div class="info"><div class="date">${fmtDate(new Date(g.date))}</div><div class="genre">${g.genre[lang]} · ${g.platform}</div><div class="count">${status(g)==="released"?c.releasedNow:remaining(new Date(g.date))}</div></div></article>`).join("");
$("empty").style.display=list.length?"none":"block";$("empty").textContent=c.empty;
$("games").querySelectorAll(".game").forEach(card=>card.onclick=()=>openDetail(card.dataset.id));
}
function openDetail(id){selected=games.find(g=>g.id===id);if(!selected)return;let c=copy[lang];$("detail").classList.add("open");$("detailBg").style.backgroundImage=`url('${selected.image}')`;$("dTitle").textContent=selected.title;$("dEyebrow").textContent=c.dEyebrow;$("countLabel").textContent=c.countLabel;$("dateLabel").textContent=c.dateLabel;$("platformLabel").textContent=c.platformLabel;$("genreLabel").textContent=c.genreLabel;$("statusLabel").textContent=c.statusLabel;$("dDate").textContent=fmtDate(new Date(selected.date));$("dPlatform").textContent=selected.platform;$("dGenre").textContent=selected.genre[lang];$("dNote").textContent=selected.note[lang];$("detailLangBtn").textContent=lang==="fa"?"English":"فارسی";updateTimer();clearInterval(timerInterval);timerInterval=setInterval(updateTimer,1000)}
function updateTimer(){if(!selected)return;let c=copy[lang],date=new Date(selected.date),r=remaining(date);$("timer").textContent=r||c.releasedNow;$("dStatus").textContent=status(selected)==="released"?c.releasedNow:c.upcoming}
$("backBtn").onclick=()=>{$("detail").classList.remove("open");clearInterval(timerInterval);selected=null};
$("langBtn").onclick=$("detailLangBtn").onclick=()=>{lang=lang==="fa"?"en":"fa";render();if(selected)openDetail(selected.id)};
render();
</script></body></html>
